<!DOCTYPE html>

  <title>Mappa pali sala corrente continua CC2</title>

  <style>
    .map-container {
      position: relative;
      width: 100%;
      max-width: 100%;
      height: auto;
    }

    .map-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .marker {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      border: 2px solid #fff;
      user-select: none;
    }

    .azzurro { background: #0099ff; }
    .verde   { background: #00cc44; }
    .viola   { background: #9b30ff; }
    .rosso   { background: #ff3333; }

    .selected {
      width: 28px !important;
      height: 28px !important;
      border: 3px solid yellow !important;
      z-index: 20;
    }

    .tooltip {
      position: absolute;
      padding: 6px 10px;
      background: rgba(0,0,0,0.85);
      color: #fff;
      font-size: 16px;
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-weight: 600;
      border-radius: 4px;
      white-space: nowrap;
      transform: translate(-50%, -120%);
      pointer-events: none;
      display: none;
      z-index: 30;
    }
  </style>
</head>

    const map = document.getElementById("map");

    let selectedMarker = null;

    markers.forEach(m => {
      const el = document.createElement("div");

      // LOGICA COLORE CC2
      let colorClass = "";

if (m.n >= 365 && m.n <= 394) {
  colorClass = "viola";
} else if (m.n >= 395 && m.n <= 434) {
  colorClass = "rosso";
}

      el.className = "marker " + colorClass;

      el.style.left = (m.x * 100) + "%";
      el.style.top = (m.y * 100) + "%";

      el.addEventListener("mouseenter", () => {
        tooltip.textContent = "Palo " + m.n;
        tooltip.style.left = (m.x * 100) + "%";
        tooltip.style.top = (m.y * 100) + "%";
        tooltip.style.display = "block";
      });

      el.addEventListener("mouseleave", () => {
        tooltip.style.display = "none";
      });

      el.addEventListener("click", () => {
        if (selectedMarker) selectedMarker.classList.remove("selected");
        el.classList.add("selected");
        selectedMarker = el;
        window.open(m.pdf, "_blank");
      });

      map.appendChild(el);
    });
